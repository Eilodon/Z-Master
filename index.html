<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="apple-mobile-web-app-title" content="Thầy.AI">

  <meta property="og:description" content="Đồng hành tâm linh với AI inspired by Thích Nhất Hạnh">
  <meta property="og:type" content="website">

  <!-- Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: https://cdn-icons-png.flaticon.com https://*.flaticon.com;
    media-src 'self' blob:;
    connect-src 'self' https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://*.workers.dev https://huggingface.co https://cdn-lfs.huggingface.co ws://localhost:* http://localhost:*;
    worker-src 'self' blob:;
    base-uri 'self';
    form-action 'self';
  ">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.8);
      --ease-in: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out: cubic-bezier(0.4, 0, 1, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif {
      font-family: 'Noto Serif', serif;
    }

    /* Utility Animations from Design Kit */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .animate-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes slideRight {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Enhanced animations */
    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      }

      50% {
        box-shadow: 0 0 40px rgba(0, 243, 255, 0.6);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    @keyframes pulse-slow {

      0%,
      100% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes bounce-subtle {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes rotate-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes wave {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .animate-glow {
      animation: glow 2s ease-in-out infinite;
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    .animate-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    .animate-pulse-slow {
      animation: pulse-slow 3s ease-in-out infinite;
    }

    .animate-bounce-subtle {
      animation: bounce-subtle 2s ease-in-out infinite;
    }

    .animate-rotate-slow {
      animation: rotate-slow 20s linear infinite;
    }

    .animate-wave {
      animation: wave 2s ease-in-out infinite;
    }

    /* Scrollbar hiding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      /* scrollbar-width: none; */
      /* Commented out for broader compatibility */
      /* Fallback for browsers that don't support scrollbar-width */
    }

    /* Modern browsers that support scrollbar-width */
    @supports (scrollbar-width: none) {
      .no-scrollbar {
        scrollbar-width: none;
      }
    }

    /* Fallback for older browsers */
    @supports not (scrollbar-width: none) {
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        overflow: -moz-scrollbars-none;
      }
    }

    /* Modern Scrollbar for history */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(0, 243, 255, 0.3), rgba(147, 51, 234, 0.3));
      border-radius: 3px;
      transition: background-color 0.2s ease;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(0, 243, 255, 0.5), rgba(147, 51, 234, 0.5));
    }

    /* Enhanced glassmorphism */
    .glass-enhanced {
      background: rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    /* Modern color palette */
    .primary-gradient {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    }

    .secondary-gradient {
      background: linear-gradient(135deg, #10b981, #06b6d4);
    }

    .accent-gradient {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
    }

    /* Enhanced shadows */
    .shadow-glow {
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
    }

    .shadow-card {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    /* Dynamic width utilities for progress bars */
    .progress-bar-fill {
      transition: all 0.7s ease;
    }

    .dna-bar-fill {
      transition: all 0.7s ease;
    }

    .results-bar-fill {
      transition: all 1s ease;
    }

    /* Width utilities for progress bars */
    .w-0 {
      width: 0%;
    }

    .w-10 {
      width: 10%;
    }

    .w-20 {
      width: 20%;
    }

    .w-30 {
      width: 30%;
    }

    .w-40 {
      width: 40%;
    }

    .w-50 {
      width: 50%;
    }

    .w-60 {
      width: 60%;
    }

    .w-70 {
      width: 70%;
    }

    .w-80 {
      width: 80%;
    }

    .w-90 {
      width: 90%;
    }

    .w-100 {
      width: 100%;
    }
  </style>

</head>

<body class="bg-gray-900 text-gray-100 h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker failed', err));
      });
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
